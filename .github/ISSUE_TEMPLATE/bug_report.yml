name: Bug report
description: Report a reproducible problem without sharing private note content.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please replace personal text and handwriting samples with safe test data.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: List the smallest set of steps that reproduces the issue.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser or Node.js version
    validations:
      required: true
